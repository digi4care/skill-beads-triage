text: |
  The package shall provide one canonical Agent Skills-compatible bead-triage skill with relative references and exactly seven thin OpenCode command templates for continue, complete, add, status, tests, reflect, and scaffold. The canonical skill shall route direct <mode> [arguments] invocation to exactly one mode reference. Other harness adapters shall reuse the canonical skill without duplicating it or introducing harness-specific skill-loading syntax into shared instructions. OpenCode commands shall preserve the user's current agent and model selection.
