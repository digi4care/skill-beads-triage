text: |
  The bt-triage installer shall support global, project, and custom-target installation for the opencode, claude, codex, pi, generic agents, and omp adapters, using their documented skill paths. It shall install command files for OpenCode in all scopes and for omp in the global scope only; all other adapters are skill-only. It shall preserve safe updates and uninstall across adapters that share .agents/skills files, migrate existing registries, and remove a shared file only after its last registered owner is removed. It shall provide accurate help and diagnostics, dry-run behavior, collision handling, and registry-based uninstall that preserves unrelated or modified user data. It shall not perform Git commits, pushes, releases, or br sync.
