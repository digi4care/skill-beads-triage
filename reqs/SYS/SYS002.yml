text: |
  The bt-triage installer shall support global, project, and custom-target installation of both skill and commands. It shall provide accurate help and diagnostics, dry-run behavior, collision handling, safe updates, and registry-based uninstall that removes only registered files and preserves unrelated or modified user data. It shall not perform Git commits, pushes, releases, or br sync.
