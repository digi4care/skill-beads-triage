  The repository shall use Biome, markdownlint-cli2, Node built-in tests, and npm package verification. npm and npm-check-updates shall enforce a seven-day release-age policy. A pre-push workflow shall check for eligible updates and run full validation; only up-to-date validated code may be pushed. Exceptions require explicit user approval.
