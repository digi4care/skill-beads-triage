text: |
  The packaged skill and command files shall carry frontmatter that every supported harness can parse, so no adapter silently skips a shipped asset. The canonical skill shall express invocation control with the portable `disable-model-invocation` field instead of a harness-specific metadata key, so one canonical skill file stays loadable for every adapter.
